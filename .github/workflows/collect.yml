name: collect-and-score

on:
  # YouTube quota (10,000 units) resets at 08:00 UTC; each job stays within it.
  schedule:
    - cron: "37 8 * * *"  # daily: new-video log (~2,000-4,000 units)
    - cron: "51 8 * * 1"  # Mondays: web demand + YouTube reach sample (~4,100)
    - cron: "51 8 * * 4"  # Thursdays: channel upload histories (up to ~6,000)
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated: wiki,trends,trends_solo,youtube,youtube_panel,youtube_daily,reddit"
        required: true
        default: "wiki,trends,trends_solo,youtube"
      niches:
        description: "Optional comma-separated niche ids (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: niche-scout
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest main when the run starts, not when it was queued

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Choose sources
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_SOURCES: ${{ inputs.sources }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            case "$CRON" in
              "37 8 * * *") SOURCES="youtube_daily" ;;
              "51 8 * * 1") SOURCES="wiki,trends,trends_solo,youtube" ;;
              "51 8 * * 4") SOURCES="youtube_panel" ;;
              *) echo "Unknown schedule $CRON"; exit 1 ;;
            esac
          else
            SOURCES="$INPUT_SOURCES"
          fi
          echo "SOURCES=$SOURCES" >> "$GITHUB_ENV"
          echo "Running sources: $SOURCES"

      - name: Collect raw data
        env:
          NICHES: ${{ inputs.niches }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python collect.py --sources "$SOURCES" --niches "$NICHES"

      - name: Score and chart
        run: python score.py

      - name: Export dashboard data
        run: python export_dashboard.py

      - name: Show fetch errors
        if: always()
        run: |
          if [ -f data/raw/errors.csv ]; then cat data/raw/errors.csv; fi

      - name: Keep a copy of the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niche-scout-data-${{ github.run_id }}
          path: |
            data
            docs/data
          retention-days: 30

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data charts docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: collect $SOURCES ($(date -u +%Y-%m-%d))"
            git pull --rebase --quiet -X theirs
            git push
          fi
