name: collect-and-score

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated: wiki,trends,trends_solo,youtube,reddit"
        required: true
        default: "wiki,youtube,reddit,trends,trends_solo"
      niches:
        description: "Optional comma-separated niche ids (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: niche-scout
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest main when the run starts, not when it was queued

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect raw data
        env:
          SOURCES: ${{ inputs.sources }}
          NICHES: ${{ inputs.niches }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python collect.py --sources "$SOURCES" --niches "$NICHES"

      - name: Score and chart
        run: python score.py

      - name: Export dashboard data
        run: python export_dashboard.py

      - name: Show fetch errors
        if: always()
        run: |
          if [ -f data/raw/errors.csv ]; then cat data/raw/errors.csv; fi

      - name: Keep a copy of the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niche-scout-data-${{ github.run_id }}
          path: |
            data
            docs/data
          retention-days: 30

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data charts docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: collect $SOURCES ($(date -u +%Y-%m-%d))"
            git pull --rebase --quiet -X theirs
            git push
          fi
        env:
          SOURCES: ${{ inputs.sources }}
